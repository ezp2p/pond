openapi: 3.1.0
info:
  title: Pond API
  version: 0.1.0
  description: |
    What a member's Puddle calls on a Pond (docs/design.md). Every request carries `X-Puddle-Signature`, made exactly as for
    a request between Puddles (Puddle's docs/streams.md, "Request signatures"), signed for the Pond's id: a Pond's id is made
    like a user id, from its key. Joining is the one exception, signed for `*`, since the Puddle does not know the Pond's id
    until it has joined.

    Anything that fails a check (no signature, a bad one, someone who is not a member, an unknown, used-up, expired or
    revoked invite, a path that does not exist) gets the same `404` as a path that does not exist, so nobody learns anything
    from a refusal.
    Once a request is known to be from a member, mistakes are answered with `{"error": "<code>"}`.

    Every request is sealed to the Pond's sealing key (`X-Puddle-Seal`; `pond.seal_key`, and `k` in invites) and every
    answer is sealed back to the member (protocol 5, feature `sealed`; the Puddle Protocol, spec/09-sealing.md), so TLS only
    carries it and any certificate will do. Every answer to a member, and the answer to a join that worked, carries
    `X-Puddle-Receipt` v2 (feature `receipts`): the Pond's signature over the request's nonce, the status and the SHA-256 of
    the body as sent, exactly as a Puddle signs its answers (spec/02-signatures.md), checked with the key in `pond.key`.
    The `404` carries none; to a request the Pond opened, it comes sealed, so a removed member knows it is the Pond's.

    Within /pond/v1 things are only added, and a Puddle ignores fields and event kinds it does not know; `/info` says which
    additions a Pond has (`protocol`, `features`). A change an older Puddle would misread gets new paths, /pond/v2.

    Only GET and POST are used. Bodies are JSON, up to 32 KiB, except a send (64 KiB), beginning a file (256 KiB), and a
    file's chunk or a picture, which are their bytes (up to 1 MiB).
servers:
  - url: https://pond.example.org
paths:
  /pond/v1/join:
    post:
      summary: Join with an invite
      description: |
        Signed for `*`, by the newest key in `chain`. Spends one use of the invite, unless the sender is already a member, in
        which case it spends nothing and only updates their keys and profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite, chain]
              properties:
                invite: { type: string, pattern: "^[a-z2-7]{26}$" }
                chain: { type: string, description: "The Puddle's key chain, one record per line" }
                profile: { $ref: "#/components/schemas/Profile" }
      responses:
        "200": { $ref: "#/components/responses/Info" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: Not joined }
  /pond/v1/keys:
    post:
      summary: The member's keys changed
      description: Signed by the new key and proven by `chain`, which must belong to the member and be no older than the one held.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chain]
              properties:
                chain: { type: string }
      responses:
        "204": { description: Recorded (an older chain is ignored) }
  /pond/v1/info:
    get:
      summary: The Pond, the member, the channels and the newest event
      responses:
        "200": { $ref: "#/components/responses/Info" }
  /pond/v1/channels/{channel}/messages:
    get:
      summary: History, newest first
      parameters:
        - { $ref: "#/components/parameters/Channel" }
        - { name: before, in: query, schema: { type: integer, minimum: 1 }, description: Only messages with a lower id }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: The messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
        "404": { description: "No such channel (`no_channel`)" }
  /pond/v1/channels/{channel}/send:
    post:
      summary: Post a message
      description: |
        A second send with the same `nonce` from the same member posts nothing and answers with the first message, so a
        Puddle that lost an answer can send again safely. Each member may send 5 a second, with bursts of up to 20 (`429`).
      parameters:
        - { $ref: "#/components/parameters/Channel" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: "Up to 4000 characters once trimmed, and at least 1 unless there are files (`bad_text`). Required without files."
                nonce: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$" }
                files:
                  type: array
                  maxItems: 10
                  description: |
                    Files the message carries (docs/design.md, "Files"), each one whole on the Pond already (sent with
                    /pond/v1/files/{file}). The size is the Pond's own; anything else in an entry is ignored.
                  items: { $ref: "#/components/schemas/FileRef" }
      responses:
        "200":
          description: The message as posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { description: "`bad_text`, `bad_file` (a name with a folder in it, a preview that is not base64...), `too_many_files`" }
        "404": { description: "No such channel (`no_channel`)" }
        "409": { description: "`no_file`, with `file`: one of the files is not here whole; `files_off`: the Pond takes no files; `muted`, with `until` (ms, or null until unmuted): an operator or administrator muted the sender" }
        "429": { description: "Too many (`slow_down`)" }
  /pond/v1/channels/{channel}/messages/{message}/edit:
    post:
      summary: Edit one's own message (protocol 14, feature `message_edits`; docs/design.md, "Editing and deleting messages")
      description: |
        Only its author edits a message. `text` replaces its words (cleaned as a send's); `files` are the ids of the files it
        keeps, which must be some of those it carries now: an edit drops files, never adds one. What it said before, and the
        files it carried then, go in the message log. Every member hears of it in a `message_edited` event, and the events that
        said the message before are rewritten to say it as it reads now. The same text and files answer the message and change
        nothing. Counts against the sender's rate for sends; refused while they are muted.
      parameters:
        - { $ref: "#/components/parameters/Channel" }
        - { name: message, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, description: "Up to 4000 characters once trimmed; may be empty while it keeps a file" }
                files: { type: array, maxItems: 10, items: { type: string, pattern: "^[0-9a-f]{64}$" } }
      responses:
        "200":
          description: The message as it now reads, with `edited`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { description: "`bad_text` (too long, or nothing left), `bad_file` (a file it doesn't carry)" }
        "404": { description: "`no_channel`; `no_message`: none here, deleted, or not the sender's" }
        "409": { description: "`muted`, with `until`" }
        "429": { description: "`slow_down`" }
  /pond/v1/channels/{channel}/messages/{message}/delete:
    post:
      summary: Delete a message (protocol 14)
      description: |
        One's own, or anyone's in a channel where one may `manage_messages` (operators and administrators everywhere). It is
        gone for every member at once (`message_deleted`, and the events that said it become `message_deleted` too), but the
        Pond keeps it, with every text it had and its files, in the message log until it is purged. A deletion by someone else
        goes in `admin_log`.
      parameters:
        - { $ref: "#/components/parameters/Channel" }
        - { name: message, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Deleted }
        "404": { description: "`no_channel`, `no_message` (none here, or deleted already)" }
        "409": { description: "`no_permission`: someone else's, and the member may not manage messages here" }
  /pond/v1/channels/{channel}/messages/{message}/versions:
    get:
      summary: One message with every text it had (protocol 14), for whoever may `view_message_log` in the channel
      parameters:
        - { $ref: "#/components/parameters/Channel" }
        - { name: message, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoggedMessage" }
        "404": { description: "`no_channel` (also without the permission), `no_message`" }
  /pond/v1/channels/{channel}/log:
    get:
      summary: The channel's message log (protocol 14), for whoever may `view_message_log` there
      description: Its messages that were edited or deleted, newest first, each with every text it had and every file it carried.
      parameters:
        - { $ref: "#/components/parameters/Channel" }
        - { name: before, in: query, schema: { type: integer, minimum: 1 }, description: Only messages with a lower id }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: The log
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/LoggedMessage" } }
        "404": { description: "`no_channel` (also without the permission)" }
  /pond/v1/channels/{channel}/messages/{message}/purge:
    post:
      summary: Erase a deleted message for good (protocol 14)
      description: |
        For whoever may both `manage_messages` and `view_message_log` in the channel. The message, every text it had and its
        files go: a file at once, unless another message or a page carries it. Nothing can bring them back. Goes in `admin_log`.
      parameters:
        - { $ref: "#/components/parameters/Channel" }
        - { name: message, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Erased }
        "404": { description: "`no_channel` (also without the permissions), `no_message`" }
        "409": { description: "`not_deleted`: delete it first" }
  /pond/v1/files/{file}:
    post:
      summary: Begin sending a file
      description: |
        Say a file's size and chunk hashes; the answer is which chunks the Pond still wants. Beginning one that is here
        already, or partly, is how a Puddle picks up where it stopped. A file no message carries is thrown away a day after
        it was begun.
      parameters:
        - { $ref: "#/components/parameters/File" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size, chunks]
              properties:
                size: { type: integer, minimum: 1, description: "At most the Pond's `files.max_size`" }
                chunks:
                  type: string
                  description: Base64 of the chunk hashes, 32 bytes each, in order. Their SHA-256 must be the file's id.
      responses:
        "200":
          description: The chunks still wanted; none if the file is here whole
          content:
            application/json:
              schema:
                type: object
                properties:
                  missing: { type: array, items: { type: integer } }
        "400": { description: "`bad_file`: the hashes are not this file's, or do not fit the size" }
        "409": { description: "`files_off`; or `other_size`: someone began it with another size" }
        "413":
          description: Larger than the Pond takes
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { const: too_large }
                  max: { type: integer }
  /pond/v1/files/{file}/chunks:
    get:
      summary: A file's chunk hashes
      description: |
        Of a whole file a message in a channel carries (or one the member sent). Anything else is `404` (`no_file`).
      parameters:
        - { $ref: "#/components/parameters/File" }
      responses:
        "200":
          description: The hashes, 32 bytes each, in order
          content:
            application/octet-stream: {}
        "404": { description: "`no_file`" }
  /pond/v1/files/{file}/chunks/{n}:
    get:
      summary: One chunk of a file
      description: As for its hashes. Each member may fetch or send 20 chunks a second, with bursts of 64 (`429`).
      parameters:
        - { $ref: "#/components/parameters/File" }
        - { $ref: "#/components/parameters/Chunk" }
      responses:
        "200":
          description: Its bytes
          content:
            application/octet-stream: {}
        "404": { description: "`no_file`, `no_chunk`" }
        "429": { description: "`slow_down`" }
    post:
      summary: Send one chunk of a file
      description: |
        The body is the chunk's bytes: 1 MiB, or what is left for the last. It is kept only if it hashes to what the file
        was begun with. Once every chunk is here the file is whole, and a message may carry it.
      parameters:
        - { $ref: "#/components/parameters/File" }
        - { $ref: "#/components/parameters/Chunk" }
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "204": { description: Kept (or the file was already whole) }
        "400": { description: "`bad_chunk`: no such chunk, the wrong length, or not the bytes it should be" }
        "404": { description: "`no_file`: not begun" }
        "429": { description: "`slow_down`" }
  /pond/v1/pictures:
    post:
      summary: Send a picture, for the member's profile (or, by an administrator, for the Pond's icon)
      description: |
        Protocol 6, feature `pictures` (docs/design.md, "Pictures"). The body is the image's bytes: PNG, JPEG, GIF or WebP,
        judged by its first bytes, up to 1 MiB. It is kept once, by its SHA-256, the hash a Puddle names a picture by in a
        profile; the member then names it in the profile they show the Pond (`POST /pond/v1/profile`), as `{hash, mime,
        size}`. A picture nobody is shown is let go after a day. Counts against the member's rate for file chunks.
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200":
          description: Kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PictureRef" }
        "400": { description: "`bad_picture`: not an image of a kind the Pond takes" }
        "429": { description: "`slow_down`" }
  /pond/v1/pictures/{hash}:
    get:
      summary: A picture the members are shown
      description: |
        The Pond's icon, or a picture named in the profile of someone who is a member. A Puddle checks what it gets against the
        `{hash, mime, size}` that named it before showing it. Anything else is `404` (`no_picture`), so a guessed hash says
        nothing of what the Pond holds.
      parameters:
        - { name: hash, in: path, required: true, description: "The picture's SHA-256, hex", schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
      responses:
        "200":
          description: Its bytes
          content:
            application/octet-stream: {}
        "404": { description: "`no_picture`" }
        "429": { description: "`slow_down`" }
  /pond/v1/members/{member}/chain:
    get:
      summary: A member's key chain, to seal a letter to them and check theirs (protocol 8)
      description: The chain as the Pond holds it. A Puddle checks it against the member's id (the protocol's part 01) before using it.
      parameters:
        - { name: member, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The chain
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string }, chain: { type: string } } }
        "404": { description: "`no_member`" }
  /pond/v1/dms/send:
    post:
      summary: Relay a letter to another member (protocol 8, feature `dms`; docs/dms.md)
      description: |
        The letter is sealed to the recipient (the protocol's part 10); the Pond reads none of it and keeps none of it. When the
        recipient's Puddle is following the events, the letter goes to it as the event `dm` (for it alone, not numbered,
        never stored) and the answer says `relayed: true`. When it isn't, `relayed: false`, and the sender gets the event
        `dm_back` `{member}` once that member's Puddle follows again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, id, kid, enc, sealed]
              properties:
                to: { type: string }
                id: { type: string, description: 64 hex }
                kid: { type: string, description: hex SHA-256 of the recipient's encryption key it is sealed to }
                enc: { type: string, description: base64 of HPKE's enc (32 bytes) }
                sealed: { type: string, description: base64, at most 128 KiB }
      responses:
        "200":
          description: Relayed, or the recipient is away
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string }, relayed: { type: boolean } } }
        "400": { description: "`bad_request`" }
        "404": { description: "`no_member`: either is not a member now" }
        "409": { description: "`not_accepted` (they take no direct messages here), `dms_off` (the Pond relays none)" }
        "429": { description: "`slow_down`, `too_many_new` (20 new people a day)" }
  /pond/v1/apply:
    post:
      summary: Apply to join, answering the entry form (protocol 13; docs/design.md, "Entry form")
      description: As a join is sent (a stranger, sealed to the invite's key, signed by the chain). Spends one use of the invite.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [invite, chain, answers], properties: { invite: { type: string }, chain: { type: string }, profile: { type: object }, answers: { type: object, description: "question id: text, or [choices]" } } } } } }
      responses:
        "200": { description: "`{status: pending}`" }
        "400": { description: "`bad_request`, with a message saying which answer" }
        "404": { description: Not a good invite (as for joining) }
        "409": { description: "`application_pending`, `already_member`, `no_form`" }
  /pond/v1/orders:
    get:
      summary: The member's own orders, newest first (protocol 13, "Shop")
      responses: { "200": { description: "`{orders: [Order]}`" } }
  /pond/v1/pages/{page}/roles:
    post:
      summary: Of the roles a roles page offers, those the member holds now (protocol 13)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [roles], properties: { roles: { type: array, items: { type: integer } } } } } } }
      responses: { "200": { description: "`{roles}`" }, "409": { description: "`not_offered`, `one_only`" } }
  /pond/v1/pages/{page}/events/{event}/going:
    post:
      summary: Whether the member is going (protocol 13)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [going], properties: { going: { type: boolean } } } } } }
      responses: { "200": { description: "`{going, count}`" } }
  /pond/v1/pages/{page}/items/{item}/buy:
    post:
      summary: 'Buy (protocol 13, "Shop"): a Stripe Payment Link for this order alone'
      requestBody: { content: { application/json: { schema: { type: object, properties: { quantity: { type: integer, minimum: 1, maximum: 100 }, amount: { type: integer, description: "For one paid as wished: what one costs, at least its price" } } } } } }
      responses:
        "200": { description: "`{order, url}`: where to pay" }
        "409": { description: "`no_payments`, `sold_out`, `too_little` (`least`)" }
        "502": { description: "`stripe_failed`, with Stripe's message" }
  /pond/v1/voice/members/{member}/mute:
    post:
      summary: Mute someone in voice for everyone, or unmute (protocol 13, "Voice moderation"); needs voice_mute in their channel
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [muted], properties: { muted: { type: boolean } } } } } }
      responses: { "204": { description: Done }, "404": { description: "`no_session`" }, "409": { description: "`outranked`, `not_yourself`" } }
  /pond/v1/voice/members/{member}/disconnect:
    post:
      summary: 'Take someone out of their voice channel (protocol 13); needs move_members there. `voice_left` says `by`.'
      responses: { "204": { description: Done }, "404": { description: "`no_session`" }, "409": { description: "`outranked`, `not_yourself`" } }
  /pond/v1/role_color:
    post:
      summary: Whether this member's name shows in their highest coloured role's colour (protocol 12, feature `role_colors`)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [use], properties: { use: { type: boolean } } } } } }
      responses:
        "200": { description: "`{use}`; a `member` event tells everyone (a member's `role_color`)" }
        "400": { description: "`bad_request`" }
  /pond/v1/dms/settings:
    post:
      summary: Whether this member takes direct messages here
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [accept], properties: { accept: { type: boolean } } }
      responses:
        "200": { description: "`{accept}`; a `member` event tells everyone (a member's `dms`)" }
  /pond/v1/dms/files/{letter}/{n}/{piece}:
    get:
      summary: A piece of a file a letter carries, asked for by its recipient (`?from=` the sender)
      description: |
        The Pond sends the sender's Puddle the event `dm_want` `{to, letter, file, part}` and waits up to 30 seconds for it to
        send the piece. `piece` is `hashes` or a chunk's number. The bytes are sealed under the file's key (part 10, "Files").
      parameters:
        - { name: letter, in: path, required: true, schema: { type: string } }
        - { name: n, in: path, required: true, description: the file's place in the letter, 0 to 9, schema: { type: integer } }
        - { name: piece, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: The sealed piece, content: { application/octet-stream: {} } }
        "400": { description: "`bad_part`, `bad_query`" }
        "409": { description: "`away` (the sender's Puddle isn't following, or didn't send it), `files_off`" }
    post:
      summary: The sender's answer to `dm_want` (`?to=` the recipient)
      parameters:
        - { name: letter, in: path, required: true, schema: { type: string } }
        - { name: n, in: path, required: true, schema: { type: integer } }
        - { name: piece, in: path, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/octet-stream: {} } }
      responses:
        "204": { description: Handed to the request waiting for it }
        "404": { description: "`not_asked`: nobody waits for it (any more)" }
  /pond/v1/events:
    get:
      summary: What happened after an event, waiting for something to happen
      description: |
        Answers as soon as there is an event after `after`, with up to 200, or with none after 25 seconds. Ask again from the
        `cursor` in the answer. `{"reset": true}` means `after` is older than the events kept (7 days): fetch `/info` and
        history again rather than replaying.
      parameters:
        - { name: after, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Events, or a reset
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [events, cursor]
                    properties:
                      events: { type: array, items: { $ref: "#/components/schemas/Event" } }
                      cursor: { type: integer }
                  - type: object
                    required: [reset]
                    properties:
                      reset: { const: true }
  /pond/v1/members:
    get:
      summary: Everyone in the Pond
      responses:
        "200":
          description: The members, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/Member" } }
  /pond/v1/profile:
    post:
      summary: Change how the member appears in this Pond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { $ref: "#/components/schemas/Profile" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
  /pond/v1/leave:
    post:
      summary: Stop being a member
      description: Their messages stay. Joining again needs an invite.
      responses:
        "204": { description: Left }
  /pond/v1/roles/answer:
    post:
      summary: Accept or decline a role the Pond offers
      description: |
        The offer arrives as a `role_offer` event for this member alone, and in `/info` as `offer` (docs/design.md, "Roles").
        Accepting gives the role at once, and a `member` event tells everyone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offer, accept]
              properties:
                offer: { type: integer }
                accept: { type: boolean }
      responses:
        "200": { description: "The member's role now", content: { application/json: { schema: { type: object, properties: { role: { $ref: "#/components/schemas/Role" } } } } } }
        "404": { description: "`no_offer`: no such offer open to this member (answered, lapsed after 7 days, or another's)" }
  /pond/v1/channels/{channel}/voice/join:
    post:
      summary: Come into a voice channel (docs/voice.md)
      description: |
        With `voice` in `features` (protocol 4). The Puddle offers a WebRTC connection, complete with its candidates: an Opus
        track `audio` and an H.264 track `video` it sends, video tracks `v1` to `v16` it only receives, and a data channel
        `frames` (unordered, never sent again). The Pond answers, and adds the address the request came from at `udp` as a
        candidate; the Puddle adds the Pond's own address at the Pond's `udp`. Once the connection is up, every member is told
        (a `voice` event). A member is in one voice channel at a time: joining again replaces the connection (in the same
        channel it keeps the slot and nobody is told again; in another it leaves the first).
      parameters: [{ $ref: "#/components/parameters/Channel" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sdp, udp]
              properties:
                sdp: { type: string, description: The offer }
                udp: { type: integer, description: "The UDP port the Puddle's calls use (0: none to add)" }
      responses:
        "200":
          description: In
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: string, pattern: "^[a-z2-7]{26}$", description: "Names this connection in the routes below" }
                  sdp: { type: string, description: The answer }
                  udp: { type: integer, description: The Pond's UDP port for voice }
                  slot: { type: integer, description: "This member's number in the channel: the frames others get carry it" }
        "400": { description: "`bad_request`, `bad_sdp`: an offer that can't be used" }
        "404": { description: "`no_channel`: not a voice channel" }
        "409": { description: "`full`: the channel has as many as the operator allows" }
  /pond/v1/voice/{session}/state:
    post:
      summary: Muted, deafened, camera on
      description: |
        Any of the three; the others stay. A change tells every member (a `voice` event). Muted: the Pond forwards nothing of
        theirs. Deafened: the Pond sends them no voice. Camera: their video goes to those who watch it.
      parameters: [{ $ref: "#/components/parameters/Session" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { muted: { type: boolean }, deafened: { type: boolean }, camera: { type: boolean }, screen: { type: boolean, description: "Sharing a screen, on the `screen` track" } } }
      responses: { "204": { description: Done }, "404": { description: "`no_session`: not this member's, or over" } }
  /pond/v1/voice/{session}/watch:
    post:
      summary: Whose camera to send on which video track
      description: |
        `tracks` maps a track (`v1` .. `v16`) to a member's id, or null for none; tracks left out stay as they were. A camera
        newly on a track starts at its next key frame.
      parameters: [{ $ref: "#/components/parameters/Session" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tracks]
              properties:
                tracks:
                  type: object
                  additionalProperties: { oneOf: [{ type: string, pattern: "^[a-z2-7]{52}(/screen)?$", description: "A member's camera, or with /screen the screen they share" }, { type: "null" }] }
      responses: { "204": { description: Done }, "400": { description: "`bad_request`" }, "404": { description: "`no_session`" } }
  /pond/v1/voice/{session}/leave:
    post:
      summary: Leave the voice channel
      description: Every member is told (`voice_left`). So it is when the connection doesn't come up in 20 seconds, drops for 10, or the member is removed.
      parameters: [{ $ref: "#/components/parameters/Session" }]
      responses: { "204": { description: Left }, "404": { description: "`no_session`" } }
  /pond/v1/admin/pond:
    post:
      summary: Rename the Pond, or change its description
      description: "For operators and administrators; to anyone else, every /pond/v1/admin route is a `404` like any refusal."
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string } } } } } }
      responses: { "204": { description: Done }, "400": { $ref: "#/components/responses/AdminRefused" } }
  /pond/v1/pages/{page}:
    get:
      summary: One page, whole (protocol 11; docs/design.md, "Pages"), for any member
      parameters: [{ name: page, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: The page, content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } } }
        "404": { description: "`no_page`" }
  /pond/v1/admin/pages/create:
    post:
      summary: Make a page (protocol 11), last in the order; for whoever may `manage_pages`
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/PageChange", required: [title] } } } }
      responses:
        "200": { description: "`{id, title, kind, updated}`" }
        "400": { description: "In words an app may show; `unknown_kind`, `bad_file`" }
        "409": { description: "`no_file` (with `file`): a file not on the Pond whole; send it first" }
  /pond/v1/admin/pages/{page}/edit:
    post:
      summary: Change a page; what is given changes, and `files` replaces what it carried
      parameters: [{ name: page, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/PageChange" } } } }
      responses:
        "204": { description: Done }
        "400": { description: "In words an app may show; `unknown_kind`, `bad_file`" }
        "404": { description: "`no_page`" }
        "409": { description: "`no_file` (with `file`)" }
  /pond/v1/admin/pages/{page}/delete:
    post:
      summary: Delete a page, for everyone
      parameters: [{ name: page, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { "204": { description: Deleted }, "404": { description: "`no_page`" } }
  /pond/v1/admin/pages/order:
    post:
      summary: The order of the pages, first to last (protocol 11)
      requestBody: { content: { application/json: { schema: { type: object, required: [pages], properties: { pages: { type: array, items: { type: integer }, description: "Every page's id, each once" } } } } } }
      responses: { "204": { description: Done }, "409": { description: "`pages_changed`: not every page once" } }
  /pond/v1/admin/banner:
    post:
      summary: Set the Pond's banner, or take it away (protocol 11, feature `pages`)
      description: As the icon is set; for whoever may `manage_pond`. Every member hears of it in a `pond` event, whose `banner` changes.
      requestBody: { content: { application/json: { schema: { type: object, required: [hash], properties: { hash: { oneOf: [{ type: string, pattern: "^[0-9a-f]{64}$" }, { type: "null" }] } } } } } }
      responses: { "204": { description: Done }, "400": { $ref: "#/components/responses/AdminRefused" } }
  /pond/v1/admin/everyone:
    post:
      summary: What everyone may do (protocol 13, "Permissions"), for whoever may manage roles
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [permissions], properties: { permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } } } } } } }
      responses: { "204": { description: Done }, "400": { description: "`unknown_permission`" }, "409": { description: "`outranked`" } }
  /pond/v1/admin/channels/{channel}/overrides:
    post:
      summary: What a channel allows and denies everyone and each role, all at once (protocol 13)
      parameters: [{ $ref: "#/components/parameters/Channel" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [overrides], properties: { overrides: { type: array, items: { $ref: "#/components/schemas/Override" } } } } } } }
      responses: { "204": { description: Done }, "400": { description: "`bad_override`, `unknown_permission`" }, "404": { description: "`no_channel`, `unknown_role`" }, "409": { description: "`outranked`" } }
  /pond/v1/admin/pages/{page}/events/create:
    post:
      summary: An event on an events page (protocol 13), for whoever may manage events
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title, starts], properties: { title: { type: string }, starts: { type: integer }, ends: { type: integer }, place: { type: string }, description: { type: string } } } } } }
      responses: { "200": { description: "`{id}`" } }
  /pond/v1/admin/pages/{page}/events/{event}/edit:
    post: { summary: "What is given changes; ends null for none", responses: { "204": { description: Done } } }
  /pond/v1/admin/pages/{page}/events/{event}/delete:
    post: { summary: "Deleted, with who was going", responses: { "204": { description: Done } } }
  /pond/v1/admin/pages/{page}/items/create:
    post:
      summary: Something a shop page sells (protocol 13), for whoever may manage the shop
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title, price], properties: { title: { type: string }, price: { type: integer }, description: { type: string }, image: { type: string }, custom: { type: boolean }, stock: { oneOf: [{ type: integer }, { type: "null" }] }, active: { type: boolean } } } } } }
      responses: { "200": { description: "`{id}`" } }
  /pond/v1/admin/pages/{page}/items/{item}/edit:
    post: { summary: "What is given changes", responses: { "204": { description: Done } } }
  /pond/v1/admin/pages/{page}/items/{item}/delete:
    post: { summary: "Taken off the page; orders keep its title", responses: { "204": { description: Done } } }
  /pond/v1/admin/orders:
    get: { summary: "Every order, newest 200, for whoever may manage the shop", responses: { "200": { description: "`{orders: [Order]}` with `member`" } } }
  /pond/v1/admin/shop/stripe:
    post:
      summary: The Stripe key the shop takes payments with, or null to stop (protocol 13), for whoever may manage the Pond
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key], properties: { key: { oneOf: [{ type: string }, { type: "null" }] } } } } } }
      responses: { "204": { description: Done }, "400": { description: Not a Stripe key }, "409": { description: "`stripe_refused`, with Stripe's message" } }
  /pond/v1/admin/applications:
    get: { summary: "Applications to join, waiting first (protocol 13, \"Entry form\")", responses: { "200": { description: "`{applications: [{member, profile, answers, status, reason, created, decided_by, decided}]}`" } } }
  /pond/v1/admin/applications/{member}/accept:
    post: { summary: "They are a member now", parameters: [{ $ref: "#/components/parameters/Member" }], responses: { "204": { description: Done }, "404": { description: "`no_application`" } } }
  /pond/v1/admin/applications/{member}/decline:
    post:
      summary: Declined; they may apply again
      parameters: [{ $ref: "#/components/parameters/Member" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses: { "204": { description: Done }, "404": { description: "`no_application`" } }
  /pond/v1/admin/role_colors:
    post:
      summary: Make everyone's name show in their role's colour, or leave it to each member (protocol 12, feature `role_colors`)
      description: For whoever may `manage_pond`. Every member hears of it in a `pond` event, whose `role_colors` changes.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enforced], properties: { enforced: { type: boolean } } } } } }
      responses: { "204": { description: Done }, "400": { description: "`bad_request`" } }
  /pond/v1/admin/icon:
    post:
      summary: Set the Pond's icon, or take it away
      description: |
        Protocol 6, feature `pictures`. `hash` names a picture sent first (`POST /pond/v1/pictures`); `null` leaves the Pond
        with none. Every member hears of it in a `pond` event, whose `icon` changes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [hash]
              properties: { hash: { oneOf: [{ type: string, pattern: "^[0-9a-f]{64}$" }, { type: "null" }] } }
      responses: { "204": { description: Done }, "400": { $ref: "#/components/responses/AdminRefused" } }
  /pond/v1/admin/channels/create:
    post:
      summary: Make a channel
      description: "`kind` (protocol 4): `text` unless said; `voice` only with `voice` in `features`."
      requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, pattern: "^[a-z0-9-]{1,32}$" }, topic: { type: string }, kind: { enum: [text, voice] } } } } } }
      responses: { "204": { description: Made }, "400": { $ref: "#/components/responses/AdminRefused" } }
  /pond/v1/admin/channels/{channel}/edit:
    post:
      summary: Rename a channel, or change its topic
      parameters: [{ $ref: "#/components/parameters/Channel" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, topic: { type: string } } } } } }
      responses: { "204": { description: Done }, "400": { $ref: "#/components/responses/AdminRefused" }, "404": { description: "`no_channel`" } }
  /pond/v1/admin/channels/{channel}/delete:
    post:
      summary: Delete a channel
      parameters: [{ $ref: "#/components/parameters/Channel" }]
      responses: { "204": { description: Deleted }, "404": { description: "`no_channel`" } }
  /pond/v1/admin/channels/{channel}/roles:
    post:
      summary: Who may see a channel (protocol 9; docs/design.md, "Roles for channels")
      description: "`roles: null`: everyone. `roles: [ids]`: operators, administrators and members holding one of them; `[]` leaves it to operators and administrators. Everyone is sent a `channels` event."
      parameters: [{ $ref: "#/components/parameters/Channel" }]
      requestBody: { content: { application/json: { schema: { type: object, required: [roles], properties: { roles: { oneOf: [{ type: array, items: { type: integer } }, { type: "null" }] } } } } } }
      responses: { "204": { description: Done }, "404": { description: "`no_channel`, `unknown_role`" } }
  /pond/v1/admin/channels/order:
    post:
      summary: The order of the channels, for everyone (protocol 9)
      requestBody: { content: { application/json: { schema: { type: object, required: [channels], properties: { channels: { type: array, items: { type: integer }, description: "Every live channel's id, each once, first to last" } } } } } }
      responses: { "204": { description: Done }, "409": { description: "`channels_changed`: not every live channel once (one was made or deleted meanwhile)" } }
  /pond/v1/admin/roles/create:
    post:
      summary: Make a role (protocol 9; colour, shown apart and permissions from protocol 10), at the bottom of the order
      description: 'A member who is not an operator or administrator may give it only permissions they have (docs/design.md, "Permissions").'
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RoleChange", required: [name] } } } }
      responses:
        "200": { description: The role, content: { application/json: { schema: { $ref: "#/components/schemas/ChannelRole" } } } }
        "400": { description: "In words an app may show; or `unknown_permission`" }
        "409": { description: "`outranked`: a permission they don't have" }
  /pond/v1/admin/roles/{role}/edit:
    post:
      summary: Change a role; what is given changes
      description: A member who is not an operator or administrator may change only a role below their highest, and add only permissions they have.
      parameters: [{ name: role, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RoleChange" } } } }
      responses:
        "204": { description: Done }
        "400": { description: "In words an app may show; or `unknown_permission`" }
        "404": { description: "`unknown_role`" }
        "409": { description: "`outranked`" }
  /pond/v1/admin/roles/{role}/delete:
    post:
      summary: Delete a role; a channel that asked for it alone is left to operators and administrators
      parameters: [{ name: role, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { "204": { description: Deleted }, "404": { description: "`unknown_role`" }, "409": { description: "`outranked`: not below their highest role" } }
  /pond/v1/admin/roles/order:
    post:
      summary: The order of the roles, highest first (protocol 10)
      description: A member who is not an operator or administrator may move only roles below their highest; the rest stay where they are.
      requestBody: { content: { application/json: { schema: { type: object, required: [roles], properties: { roles: { type: array, items: { type: integer }, description: "Every role's id, each once, highest first" } } } } } }
      responses: { "204": { description: Done }, "409": { description: "`roles_changed`: not every role once (one was made or deleted meanwhile); `outranked`" } }
  /pond/v1/admin/members/{member}/roles:
    post:
      summary: The roles a member holds, these and no others (protocol 9)
      description: A member who is not an operator or administrator may give or take only roles below their highest.
      parameters: [{ $ref: "#/components/parameters/Member" }]
      requestBody: { content: { application/json: { schema: { type: object, required: [roles], properties: { roles: { type: array, items: { type: integer } } } } } } }
      responses: { "204": { description: Done }, "404": { description: "`no_member`, `unknown_role`" }, "409": { description: "`outranked`" } }
  /pond/v1/admin/members/{member}/remove:
    post:
      summary: Remove a member (they may come back with an invite)
      description: 'Only on a lower rank, never an operator, never oneself. A member let by their roles: only on a member whose highest role is below theirs (docs/design.md, "Permissions").'
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "204": { description: Removed }
        "404": { description: "`no_member`" }
        "409": { description: "`outranked` (they are your rank or above, or an operator), `not_yourself`" }
  /pond/v1/admin/members/{member}/ban:
    post:
      summary: Ban a member, who is removed and refused if they try to join again
      parameters: [{ $ref: "#/components/parameters/Member" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        "204": { description: Banned }
        "400": { $ref: "#/components/responses/AdminRefused" }
        "409": { description: "`outranked`, `not_yourself`" }
  /pond/v1/admin/members/{member}/mute:
    post:
      summary: Mute a member
      description: |
        What they write is refused (`409 muted`) and their voice is not passed on in voice channels, until `until` (ms) or,
        without it, until they are unmuted. Only on a lower rank, never an operator, never oneself. Every member hears of it:
        a `member` event, with `muted`.
      parameters: [{ $ref: "#/components/parameters/Member" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { until: { oneOf: [{ type: integer }, { type: "null" }] } } } } } }
      responses:
        "204": { description: Muted }
        "400": { description: "`bad_request`: `until` is not in the future (or over ten years ahead)" }
        "404": { description: "`no_member`" }
        "409": { description: "`outranked`, `not_yourself`" }
  /pond/v1/admin/members/{member}/unmute:
    post:
      summary: Unmute a member
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "204": { description: Unmuted (or was not muted) }
        "404": { description: "`no_member`" }
        "409": { description: "`outranked`, `not_yourself`" }
  /pond/v1/admin/bans:
    get:
      summary: Who is banned
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  bans:
                    type: array
                    items:
                      type: object
                      properties:
                        member: { type: string }
                        by: { type: string, description: "The member who banned them, or `pondctl`" }
                        reason: { type: string }
                        ts: { type: integer }
                        profile: { $ref: "#/components/schemas/Profile" }
  /pond/v1/admin/invites:
    get:
      summary: The invites that can still be used
      description: Not used up, not expired and not revoked, newest first (at most 500). Those `pondctl` made too.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { invites: { type: array, items: { $ref: "#/components/schemas/Invite" } } } }
  /pond/v1/admin/invites/create:
    post:
      summary: Make an invite
      description: |
        `uses`: how many may join with it (1 to 1000000); `expires`: when it stops working, in ms since 1970 (in the future,
        and at most ten years ahead). Either, both or neither: an invite with neither lasts until revoked.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uses: { oneOf: [{ type: integer, minimum: 1, maximum: 1000000 }, { type: "null" }] }
                expires: { oneOf: [{ type: integer }, { type: "null" }] }
      responses:
        "200": { description: Made, content: { application/json: { schema: { $ref: "#/components/schemas/Invite" } } } }
        "400": { description: "`bad_request`" }
  /pond/v1/admin/invites/{token}/revoke:
    post:
      summary: Revoke an invite
      description: It stops working at once. Those who joined with it stay.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[a-z2-7]{26}$" } }
      responses:
        "204": { description: Revoked }
        "404": { description: "`no_invite`: no such invite, or revoked already" }
  /pond/v1/admin/bans/{member}/unban:
    post:
      summary: Lift a ban
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses: { "204": { description: Lifted }, "404": { description: "`no_ban`" } }
components:
  parameters:
    Channel:
      name: channel
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Member:
      name: member
      in: path
      required: true
      description: A member's user id
      schema: { type: string, pattern: "^[a-z2-7]{52}$" }
    File:
      name: file
      in: path
      required: true
      description: The SHA-256 of its chunk hashes, as Puddle makes it (Puddle's docs/files.md, "The shape of a file")
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    Session:
      name: session
      in: path
      required: true
      description: A voice connection, as joining answered
      schema: { type: string, pattern: "^[a-z2-7]{26}$" }
    Chunk:
      name: n
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
  responses:
    Info:
      description: The Pond as the member sees it
      content:
        application/json:
          schema:
            type: object
            required: [pond, me, channels, cursor]
            properties:
              protocol:
                type: integer
                minimum: 1
                description: |
                  Which additions to /pond/v1 this Pond has; it goes up with each (docs/design.md, "Versions"). Missing means 1.
              features:
                type: array
                items: { type: string }
                description: |
                  Optional parts this Pond has. `files`: members may send files (docs/design.md, "Files"). `roles`: operators
                  and administrators (docs/design.md, "Roles"). `receipts`: every answer to a member is signed
                  (docs/design.md, "Receipts and sealing"). `sealed`: every request and answer is sealed (the same). `pictures`: the icon and members' profile pictures (protocol 6, docs/design.md, "Pictures"). `voice`: voice channels (docs/voice.md). `channel_roles`: roles for channels, and their order from the app (protocol 9, docs/design.md, "Roles for channels"). `role_permissions`: what roles let members do, their colour and order (protocol 10, "Permissions"). `pages`: pages above the channels, and the banner (protocol 11, "Pages"). `role_colors`: names in a role's colour, as each member chooses or the Pond enforces (protocol 12, "Role colours"). `overrides`: what everyone may do, and each channel's permissions (protocol 13, "Permissions"). `page_kinds`: roles, events, form and shop pages and pages for some roles ("Pages"). `applications`: the entry form ("Entry form"). `shop`: the shop ("Shop"). `voice_moderation`: muting and disconnecting in voice ("Voice moderation"). `message_edits`: editing and deleting messages, and the message log (protocol 14, "Editing and deleting messages"). Missing means none.
              pond: { $ref: "#/components/schemas/Pond" }
              me: { $ref: "#/components/schemas/Member" }
              offer:
                description: A role the Pond offers this member, waiting for their answer (protocol 2)
                oneOf:
                  - { type: object, properties: { id: { type: integer }, role: { $ref: "#/components/schemas/Role" } } }
                  - { type: "null" }
              channels: { type: array, items: { $ref: "#/components/schemas/Channel" }, description: "The channels this member may see, in order" }
              roles: { type: array, items: { $ref: "#/components/schemas/ChannelRole" }, description: "Every role (protocol 9), highest first (protocol 10)" }
              pages: { type: array, items: { $ref: "#/components/schemas/PageHead" }, description: "Every page, in order (protocol 11)" }
              voice: { type: array, items: { $ref: "#/components/schemas/InVoice" }, description: "Who is in a voice channel now (protocol 4)" }
              cursor: { type: integer, description: The newest event; follow /pond/v1/events from here }
    AdminRefused:
      description: The Pond would not do it, said in words an app may show
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { const: bad_request }
              message: { type: string }
    Error:
      description: A mistake in a request from a member
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    Profile:
      description: |
        The profile the member chose for this Pond (Puddle's api/wire/profile.yaml), or null for none. The Pond keeps it as
        sent, if it is a JSON object of up to 16 KiB; a Puddle cleans what it receives before showing it.
      oneOf:
        - type: object
        - type: "null"
    Pond:
      type: object
      properties:
        id: { type: string, description: "52 characters of base32: base32(SHA-256(key))" }
        key:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The Pond's Ed25519 public key, hex (protocol 3), which signs its receipts. Its SHA-256 is the id.
        seal_key:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The Pond's sealing key (X25519), hex (protocol 5), which members seal their requests to. An invite's `k`.
        name: { type: string }
        description: { type: string }
        icon:
          description: The Pond's icon (protocol 6, feature `pictures`), fetched from `/pond/v1/pictures/{hash}`; null for none
          oneOf:
            - { $ref: "#/components/schemas/PictureRef" }
            - type: "null"
        banner:
          description: Its banner, over its name in the channel list (protocol 11), fetched as the icon is; null for none
          oneOf:
            - { $ref: "#/components/schemas/PictureRef" }
            - type: "null"
        role_colors:
          type: string
          enum: [choice, enforced]
          description: "Names in a role's colour (protocol 12): `choice`, as each member says (their `role_color`), or `enforced`, everyone's"
        files:
          type: object
          description: What members may send, with `files` in `features`
          properties:
            max_size: { type: integer, description: "The largest file, in bytes; 0 means the admin has turned files off" }
            chunk_size: { type: integer, description: "1048576" }
            per_message: { type: integer, description: "10" }
    Invite:
      type: object
      properties:
        token: { type: string, pattern: "^[a-z2-7]{26}$" }
        link: { type: string, description: "What to give out: pond://<address>?invite=<token>&k=<the sealing key>" }
        uses: { type: integer, description: How many have joined with it }
        max_uses: { oneOf: [{ type: integer }, { type: "null" }], description: "How many may; null: no limit" }
        expires: { oneOf: [{ type: integer }, { type: "null" }], description: "When it stops working (ms); null: never" }
        created: { type: integer, description: ms }
    PictureRef:
      type: object
      description: A picture, as a profile names one (Puddle's api/wire/profile.yaml)
      properties:
        hash: { type: string, pattern: "^[0-9a-f]{64}$", description: "The SHA-256 of its bytes, hex" }
        mime: { enum: [image/png, image/jpeg, image/gif, image/webp] }
        size: { type: integer, maximum: 1048576 }
    Member:
      type: object
      properties:
        id: { type: string, description: The member's user id }
        profile: { $ref: "#/components/schemas/Profile" }
        joined: { type: integer, description: ms }
        role: { $ref: "#/components/schemas/Role" }
        muted:
          description: "Muted by an operator or administrator (protocol 7): `until` when (ms), or null until unmuted. null when not muted."
          oneOf:
            - { type: object, properties: { until: { oneOf: [{ type: integer }, { type: "null" }] } } }
            - type: "null"
        dms: { type: boolean, description: "Takes direct messages here (protocol 8; docs/dms.md)" }
        roles: { type: array, items: { type: integer }, description: "The roles for channels they hold (protocol 9)" }
        role_color: { type: boolean, description: "Their name shows in their highest coloured role's colour, as they chose (protocol 12)" }
    ChannelRole:
      type: object
      description: 'A role (docs/design.md, "Roles for channels" and "Permissions"); not a rank (`Role`)'
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 32 }
        color: { oneOf: [{ type: string, pattern: "^#[0-9a-f]{6}$" }, { type: "null" }], description: "Protocol 10" }
        hoist: { type: boolean, description: "Shown apart in the member list (protocol 10)" }
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" }, description: "What it lets its members do (protocol 10)" }
    RoleChange:
      type: object
      properties:
        name: { type: string, maxLength: 32 }
        color: { oneOf: [{ type: string, pattern: "^#[0-9a-fA-F]{6}$" }, { type: "null" }] }
        hoist: { type: boolean }
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    Permission:
      enum: [manage_pond, manage_channels, manage_roles, manage_invites, kick_members, ban_members, mute_members, manage_pages,
             view_channels, send_messages, attach_files, connect, speak, video, move_members, voice_mute, manage_events,
             manage_applications, manage_shop, manage_messages, view_message_log]
      description: 'docs/design.md, "Permissions". From view_channels on, protocol 13; manage_messages and view_message_log, protocol 14. view_channels to voice_mute, manage_messages and view_message_log are those a channel may allow or deny.'
    Override:
      type: object
      description: 'What a channel allows and denies a role, or everyone (role 0) (protocol 13)'
      required: [role, allow, deny]
      properties:
        role: { type: integer, minimum: 0 }
        allow: { type: array, items: { $ref: "#/components/schemas/Permission" } }
        deny: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    PageHead:
      type: object
      description: 'A page as /info lists it (protocol 11; docs/design.md, "Pages")'
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 64 }
        kind: { enum: [markdown, roles, events, form, shop], description: "Protocol 13 for all but markdown" }
        updated: { type: integer, description: When it last changed (ms) }
        roles: { description: "Protocol 13: null for everyone, or the roles it is for", oneOf: [{ type: array, items: { type: integer } }, { type: "null" }] }
    Page:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 64 }
        kind: { type: string }
        body: { type: string, description: "Markdown, at most 64 KiB of text" }
        files: { type: array, maxItems: 10, items: { type: object, properties: { id: { type: string }, name: { type: string }, mime: { type: string }, size: { type: integer }, w: { type: integer }, h: { type: integer } } } }
        updated: { type: integer }
        updated_by: { type: string, description: The member who last changed it }
        roles: { oneOf: [{ type: array, items: { type: integer } }, { type: "null" }] }
        data: { type: object, description: 'The kind''s settings (docs/design.md, "The kinds")' }
        mine: { type: array, items: { type: integer }, description: "A roles page: those offered that the member holds" }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        payments: { type: boolean, description: "A shop page: the Pond takes payments" }
    Event:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 100 }
        description: { type: string }
        place: { type: string, maxLength: 200 }
        starts: { type: integer, description: ms }
        ends: { oneOf: [{ type: integer }, { type: "null" }] }
        going: { type: integer }
        me: { type: boolean, description: The member asking is going }
    Item:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 100 }
        description: { type: string }
        image: { type: string, description: "The name of one of the page's media, or empty" }
        price: { type: integer, description: "In the currency's smallest unit; the least, for one paid as wished" }
        custom: { type: boolean, description: The buyer says how much }
        stock: { oneOf: [{ type: integer }, { type: "null" }] }
        active: { type: boolean }
    Order:
      type: object
      properties:
        id: { type: integer }
        item: { type: integer }
        title: { type: string }
        quantity: { type: integer }
        amount: { type: integer, description: "The whole order, in the currency's smallest unit" }
        currency: { type: string }
        status: { enum: [creating, open, paid, lapsed, failed] }
        url: { type: string, description: "While open, to the buyer: where to pay" }
        live: { type: boolean, description: "Stripe's live mode, not a test" }
        created: { type: integer }
        paid: { oneOf: [{ type: integer }, { type: "null" }] }
        member: { type: string, description: "admin/orders only" }
    PageChange:
      type: object
      properties:
        title: { type: string, maxLength: 64 }
        kind: { type: string }
        body: { type: string }
        files: { type: array, maxItems: 10, items: { type: object, required: [id, name, mime], properties: { id: { type: string }, name: { type: string }, mime: { type: string }, w: { type: integer }, h: { type: integer } } } }
        data: { type: object, description: "Protocol 13: the kind's settings" }
        roles: { description: "Protocol 13: null for everyone, or role ids", oneOf: [{ type: array, items: { type: integer } }, { type: "null" }] }
    Role:
      enum: [operator, administrator, member]
      description: "docs/design.md, \"Roles\". Missing (protocol 1) means member."
    Channel:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
        topic: { type: string }
        position: { type: integer }
        kind: { enum: [text, voice], description: "Protocol 4; missing means text. A voice channel takes messages too." }
        roles:
          description: "Protocol 9: null when everyone may see it; else the roles that may (with operators and administrators)"
          oneOf: [{ type: array, items: { type: integer } }, { type: "null" }]
        overrides: { type: array, items: { $ref: "#/components/schemas/Override" }, description: "Protocol 13" }
    InVoice:
      type: object
      description: Someone in a voice channel (docs/voice.md, "Who is in it")
      properties:
        channel: { type: integer }
        member: { type: string }
        slot: { type: integer, description: "Their number in the channel, 1 and up: the first 2 bytes of each of their frames" }
        muted: { type: boolean }
        deafened: { type: boolean }
        camera: { type: boolean }
        screen: { type: boolean, description: Sharing a screen }
    Message:
      type: object
      properties:
        id: { type: integer, description: Increasing across the whole Pond }
        channel: { type: integer }
        author: { type: string, description: The author's user id }
        text: { type: string, description: May be empty when there are files }
        ts: { type: integer, description: ms, by the Pond's clock }
        edited: { type: integer, description: "Protocol 14: when it was last edited (ms); left out when it never was" }
        files: { type: array, items: { $ref: "#/components/schemas/File" }, description: Left out when there are none }
    LoggedMessage:
      description: 'A message as the message log gives it (protocol 14; docs/design.md, "Editing and deleting messages")'
      allOf:
        - { $ref: "#/components/schemas/Message" }
        - type: object
          properties:
            text: { type: string, description: "What it said last (when it was deleted, for a deleted one)" }
            deleted: { type: object, description: "Left out while it is not deleted", properties: { ts: { type: integer }, by: { type: string, description: "A member's id, or pondctl" } } }
            files:
              description: Every file it carried; one an edit dropped has `removed` (ms)
              type: array
              items: { allOf: [{ $ref: "#/components/schemas/File" }, { type: object, properties: { removed: { type: integer } } }] }
            versions:
              description: Every earlier text, oldest first, with when it was written and replaced, and the ids of the files it carried
              type: array
              items: { type: object, properties: { text: { type: string }, ts: { type: integer }, until: { type: integer }, files: { type: array, items: { type: string } } } }
    FileRef:
      type: object
      required: [id, name, mime]
      description: A file as the sender describes it in a send
      properties:
        id: { type: string, pattern: "^[0-9a-f]{64}$" }
        name: { type: string, description: "A file name only (no / or \\), at most 255 bytes" }
        mime: { type: string, description: "As the sender says; anything that is not a type/subtype becomes application/octet-stream" }
        w: { type: integer, description: Width, for a photo or video }
        h: { type: integer }
        duration_ms: { type: integer, description: For a video or sound }
        preview: { type: string, description: "Base64 of a tiny picture (at most 1400 characters)" }
    File:
      allOf:
        - { $ref: "#/components/schemas/FileRef" }
        - type: object
          properties:
            size: { type: integer, description: The size of the file as the Pond has it }
    Event:
      type: object
      required: [id, kind, data]
      properties:
        id: { type: integer }
        kind: { enum: [message, message_edited, message_deleted, channel, channel_deleted, channels, member, member_left, pond, role, role_deleted, role_offer, role_order, page, page_deleted, page_order, voice, voice_left] }
        data:
          description: |
            message: a Message. channel: a Channel (made or changed). channel_deleted: {id}. member: a Member (joined, or a
            new profile, or a new role). member_left: {id}. pond: a Pond (new name or description, or new limits on files).
            role_offer: {id, role}, sent only to the member it is offered to. voice: an InVoice (came in, or muted, deafened
            or camera changed). voice_left: {channel, member}. Protocol 9 (docs/design.md, "Roles for channels"): channels:
            {channels: [Channel]}, every channel this member may see now, in order, replacing what they had. role: a
            ChannelRole (made or renamed). role_deleted: {id}, taken out of every member and channel. An event about a
            channel the member may not see is not given to them. Protocol 10: role carries the whole ChannelRole (made or
            changed; a new one is at the bottom), and role_order: {roles: [ids]}, every role, highest first. Protocol 11
            (docs/design.md, "Pages"): page: a PageHead (made or changed; a new one is last), page_deleted: {id}, page_order:
            {pages: [ids]}, first to last. Protocol 14 (docs/design.md, "Editing and deleting messages"): message_edited: a
            Message as it now reads, with `edited`; message_deleted: {id, channel}, no longer there. When a message is edited,
            the events that said it before say it as it now reads; when it is deleted, they become message_deleted.
