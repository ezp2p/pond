# A Pond and its MariaDB, in Docker (docs/docker.md). The file on its own is enough: no checkout needed.
#
#   1. Beside this file, a .env (copy .env.example) with:
#        POND_ADDRESS      how people reach this Pond: "pond.example.org", with port 443 forwarded to this machine for
#                          TCP and UDP (host:port if the chat port isn't 443)
#        POND_NAME         the Pond's name, given to it on the first start
#        POND_DB_PASSWORD  the database password (anything long; nothing outside these two containers uses it)
#      and optionally POND_IMAGE (ghcr.io/ezp2p/pond:dev for the newest build of dev), POND_CHAT_PORT (TCP, 443) and
#      POND_VOICE_PORT (UDP, the chat port's number).
#   2. docker compose up -d
#   3. docker exec pond pondctl invite create      the pond://… link to give out
#
# Updating: docker compose pull && docker compose up -d. The Pond keeps its key in the "pond" volume and everything else
# in MariaDB's, "db": back up both.

services:
  pond:
    image: ${POND_IMAGE:-ghcr.io/ezp2p/pond:latest}
    container_name: pond   # so docker exec pond … (docs/docker.md) finds it
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POND_ADDRESS: ${POND_ADDRESS:?set POND_ADDRESS in .env, e.g. pond.example.org}
      POND_NAME: ${POND_NAME:?set POND_NAME in .env, the Pond's name}
      POND_CHAT_PORT: ${POND_CHAT_PORT:-443}
      POND_VOICE_PORT: ${POND_VOICE_PORT:-${POND_CHAT_PORT:-443}}
      POND_DB_HOST: db
      POND_DB_PASSWORD: ${POND_DB_PASSWORD:?set POND_DB_PASSWORD in .env}
    ports:
      - "${POND_CHAT_PORT:-443}:${POND_CHAT_PORT:-443}/tcp"                                       # chat
      - "${POND_VOICE_PORT:-${POND_CHAT_PORT:-443}}:${POND_VOICE_PORT:-${POND_CHAT_PORT:-443}}/udp"   # voice and video
    volumes:
      - pond:/data

  db:
    image: mariadb:11
    container_name: pond-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pond
      MARIADB_USER: pond
      MARIADB_PASSWORD: ${POND_DB_PASSWORD:?set POND_DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db:/var/lib/mysql

volumes:
  pond:
  db:
